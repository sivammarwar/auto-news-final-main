name: Generate Articles

on:
  schedule:
    - cron: "15 16 * * *"  # 9:45 PM IST daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Trigger article generation
        run: |
          echo "Starting article generation at $(date)"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -L \
            -X POST ${{ secrets.SITE_URL }}/api/cron/generate-articles \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 21600)

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Pipeline failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Pipeline completed successfully"