name: Generate History Articles

on:
  schedule:
    - cron: "30 8 * * *"   # 4:30 AM IST daily (UTC 23:00 = IST 04:30 next day)
  workflow_dispatch:
    inputs:
      manual:
        description: "Set to true to bypass schedule check"
        required: false
        default: "true"

jobs:
  generate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3 hours — enough for 15 categories × 1 article

    steps:
      - name: Trigger history article generation (all 15 categories, 1 each)
        run: |
          echo "▶ Starting history pipeline at $(date)"
          echo "   Strategy: 1 article per category × 15 categories = 15 articles/day"

          MANUAL="${{ github.event.inputs.manual || 'true' }}"
          BODY="{\"manual\":${MANUAL}}"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -L \
            -X POST "${{ secrets.SITE_URL }}/api/cron/generate-history" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            --max-time 10800)

          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Failed with status $RESPONSE"
            exit 1
          fi

          SKIPPED=$(cat /tmp/response.json | grep -o '"skipped":true' || true)
          if [ -n "$SKIPPED" ]; then
            echo "⏭ Skipped — schedule disabled or not the right hour"
          else
            echo "✅ Generation completed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Finished at $(date)"
          if command -v jq &> /dev/null; then
            jq '.' /tmp/response.json 2>/dev/null || cat /tmp/response.json
          else
            cat /tmp/response.json
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"