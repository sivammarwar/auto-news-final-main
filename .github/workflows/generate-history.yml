name: Generate History Articles

on:
  schedule:
    - cron: "0 14 * * *"   # 2:30 PM IST daily (UTC 9:00 = IST 14:30)
  workflow_dispatch:

jobs:
  generate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Generate - ancient-civilizations
        run: |
          curl -s -X POST "${{ secrets.SITE_URL }}/api/cron/generate-history" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"manual":true,"subcategory":"ancient-civilizations"}' \
            --max-time 55 || true
          sleep 10

      - name: Generate - medieval-feudal
        run: |
          curl -s -X POST "${{ secrets.SITE_URL }}/api/cron/generate-history" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
