name: Publish Articles

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST daily (UTC 18:30 = IST 00:00)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger publish pipeline
        run: |
          echo "▶ Starting publish pipeline at $(date)"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -L \
            -X GET "${{ secrets.SITE_URL }}/api/cron/publish-articles" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60)

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Publish pipeline failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Publish pipeline completed successfully"

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Finished at $(date)"
          if command -v jq &> /dev/null; then
            jq '.' /tmp/response.json 2>/dev/null || cat /tmp/response.json
          else
            cat /tmp/response.json
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"